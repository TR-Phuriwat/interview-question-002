<div class="container">
    <div class="header">IT 02-2</div>
    <div style="padding: 40px;">
        <form (ngSubmit)="register()">
            <div class="form-group">
                <label>User</label>
                <input type="text" name="username" [(ngModel)]="user.username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" [(ngModel)]="user.password" required>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="confirmPassword" [(ngModel)]="user.confirmPassword" required>
            </div>
            <div *ngIf="errorMessage" style="color: red; text-align: center; margin-bottom: 10px;">
                {{ errorMessage }}
            </div>
            <div class="button-group">
                <button type="submit">สมัครสมาชิก</button>
            </div>
        </form>
    </div>
</div>
