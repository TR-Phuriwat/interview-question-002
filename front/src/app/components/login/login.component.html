<div class="container">
    <div class="header">IT 02-1</div>
    <div style="padding: 40px;">
        <form (ngSubmit)="login()">
            <div class="form-group">
                <label>User</label>
                <input type="text" name="username" [(ngModel)]="credentials.username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" [(ngModel)]="credentials.password" required>
            </div>
            <div *ngIf="errorMessage" style="color: red; text-align: center; margin-bottom: 10px;">
                {{ errorMessage }}
            </div>
            <div class="button-group">
                <button type="submit">ลงชื่อเข้าใช้งาน</button>
            </div>
            <div class="link-group">
                <a routerLink="/register">สมัครสมาชิก</a>
            </div>
        </form>
    </div>
</div>
